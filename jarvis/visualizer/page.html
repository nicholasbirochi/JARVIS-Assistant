<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #030711;
    --ring-dim: #0d3a52;
    --blue-idle: #1f7ea8;
    --blue-listening: #2fb6e8;
    --blue-speaking: #7fe3ff;
    --text-dim: #4f8fae;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at center, #061323 0%, var(--bg) 70%);
    overflow: hidden;
    font-family: "SF Mono", "Menlo", "Monaco", ui-monospace, monospace;
  }
  body {
    height: 100vh;
    color: var(--blue-listening);
    -webkit-user-select: none;
    user-select: none;
  }
  /* #core (sphere + status label) is positioned independently of the
     document flow, pinned to the exact center of the window -- however
     much text ends up in #transcript below never touches its size or
     position. That's the actual fix for "a rede neural muda de tamanho":
     before, everything lived in one centered flex column, so a longer
     transcript pushed/re-centered the whole column including the sphere. */
  #core {
    position: fixed;
    top: 44%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #stage {
    position: relative;
    width: min(58vh, 58vw);
    height: min(58vh, 58vw);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #status {
    margin-top: 28px;
    font-size: 13px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--text-dim);
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }
  body[data-state="listening"] #status { color: var(--blue-listening); text-shadow: 0 0 12px rgba(47,182,232,0.6); }
  body[data-state="speaking"] #status { color: var(--blue-speaking); text-shadow: 0 0 16px rgba(127,227,255,0.85); }
  body[data-state="off"] #status { color: #4a4f58; }
  body[data-state="off"] #brand, body[data-state="off"] #clock { color: #363a42; }

  /* Fixed-size scrollable panel, pinned near the bottom -- independent of
     #core above. Content can be any length; it scrolls inside its own
     box instead of growing it. Both wheel/trackpad scroll (native, via
     overflow-y) and click-drag (see the pointer handlers below, since
     this window has no scrollbar chrome and text selection is disabled)
     work to move through it. */
  #transcript-wrap {
    position: fixed;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: min(640px, 84vw);
    max-height: 22vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    opacity: 0;
    transition: opacity 0.5s ease;
    cursor: grab;
    scrollbar-width: thin;
    scrollbar-color: rgba(127,227,255,0.35) transparent;
  }
  #transcript-wrap.visible { opacity: 1; }
  #transcript-wrap.dragging { cursor: grabbing; }
  #transcript-wrap::-webkit-scrollbar { width: 5px; }
  #transcript-wrap::-webkit-scrollbar-thumb { background: rgba(127,227,255,0.35); border-radius: 3px; }
  #transcript-wrap::-webkit-scrollbar-track { background: transparent; }
  #transcript {
    padding: 6px 24px;
    text-align: center;
    font-size: 16px;
    line-height: 1.5;
    color: #cdeeff;
    text-shadow: 0 0 10px rgba(127,227,255,0.35);
  }

  #clock {
    position: fixed;
    top: 22px;
    right: 28px;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
  }
  #brand {
    position: fixed;
    top: 22px;
    left: 28px;
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--text-dim);
  }
  #brand b { color: var(--blue-listening); }
</style>
</head>
<body data-state="off">
  <div id="brand">J·A·R·V·I·S</div>
  <div id="clock">--:--:--</div>
  <div id="core">
    <div id="stage">
      <canvas id="orb"></canvas>
    </div>
    <div id="status">Desligado</div>
  </div>
  <div id="transcript-wrap"><div id="transcript"></div></div>

<script>
const canvas = document.getElementById("orb");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");
const transcriptWrap = document.getElementById("transcript-wrap");
const body = document.body;

// Click-and-drag scrolling for the transcript panel -- this window has no
// scrollbar chrome and text selection is disabled globally, so wheel/
// trackpad is the only other way to move through a long message.
(function enableDragScroll(el) {
  let dragging = false;
  let startY = 0;
  let startScrollTop = 0;
  el.addEventListener("mousedown", (ev) => {
    dragging = true;
    startY = ev.clientY;
    startScrollTop = el.scrollTop;
    el.classList.add("dragging");
    ev.preventDefault();
  });
  window.addEventListener("mousemove", (ev) => {
    if (!dragging) return;
    el.scrollTop = startScrollTop - (ev.clientY - startY);
  });
  window.addEventListener("mouseup", () => {
    dragging = false;
    el.classList.remove("dragging");
  });
})(transcriptWrap);

let dpr = Math.max(1, window.devicePixelRatio || 1);
function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
}
window.addEventListener("resize", resize);
resize();

const STATE_LABEL = { off: "Desligado", idle: "Em espera", listening: "Ouvindo...", speaking: "Falando" };
const STATE_COLOR = {
  off:       { core: [58, 64, 74], glow: 0.12 },
  idle:      { core: [31, 126, 168], glow: 0.35 },
  listening: { core: [47, 182, 232], glow: 0.65 },
  speaking:  { core: [127, 227, 255], glow: 1.0 },
};

let currentState = "off";
let stateSince = performance.now();

// The particle sphere -- a cloud of small dots distributed evenly over a
// sphere's surface (not a flat ring), each with its own independent
// "breathing" radius (moves in/out along its own sine wave, out of phase
// with its neighbors) -- that's the "bolinhas indo e voltando" look. The
// whole sphere also slowly rotates. Positions are fixed per-particle;
// only the animation (wobble phase, rotation, per-state jitter/speed)
// changes every frame.
const NUM_PARTICLES = 260;
const particles = [];
for (let i = 0; i < NUM_PARTICLES; i++) {
  particles.push({
    theta: Math.random() * Math.PI * 2,       // azimuth on the sphere
    phi: Math.acos(2 * Math.random() - 1),    // polar angle, uniform sphere distribution
    phase: Math.random() * Math.PI * 2,       // independent breathing phase
    speed: 0.5 + Math.random() * 1.1,         // independent breathing speed
    jitter: 0.5 + Math.random() * 0.7,        // per-particle amplitude multiplier
    size: 1.0 + Math.random() * 1.7,
  });
}

// Per-state motion profile: how fast the sphere spins, how far particles
// wander in/out, how bright/large they read, overall -- and `connect`,
// how strongly nearby particles link up with constellation lines (0 =
// none). Only listening/speaking connect, as requested -- idle/off stay
// as loose, unconnected dots.
const STATE_MOTION = {
  off:       { rotSpeed: 0.015, jitterAmp: 0.02, alpha: 0.30, sizeMul: 0.65, chaos: 0,    connect: 0 },
  idle:      { rotSpeed: 0.07,  jitterAmp: 0.05, alpha: 0.65, sizeMul: 0.9,  chaos: 0,    connect: 0 },
  listening: { rotSpeed: 0.16,  jitterAmp: 0.09, alpha: 0.88, sizeMul: 1.05, chaos: 0.02, connect: 0.5 },
  speaking:  { rotSpeed: 0.32,  jitterAmp: 0.17, alpha: 1.0,  sizeMul: 1.25, chaos: 0.06, connect: 0.85 },
};

let rotation = 0;
let lastFrameTime = null;

function draw(now) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) * 0.33;
  const t = now / 1000;
  const dt = lastFrameTime === null ? 0 : Math.min(0.1, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  const c = STATE_COLOR[currentState];
  const [r, g, b] = c.core;
  const m = STATE_MOTION[currentState];
  rotation += dt * m.rotSpeed;

  // Faint outer tick ring, kept as context around the sphere.
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(t * 0.05);
  ctx.strokeStyle = `rgba(${r},${g},${b},0.12)`;
  ctx.lineWidth = 1 * dpr;
  ctx.setLineDash([2 * dpr, 12 * dpr]);
  ctx.beginPath();
  ctx.arc(0, 0, R * 1.4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Soft ambient glow behind the sphere.
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.3);
  glow.addColorStop(0, `rgba(${r},${g},${b},${0.22 * c.glow})`);
  glow.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);

  // Project every particle (rotating sphere + individual radial wobble),
  // then paint back-to-front so the sphere reads as solid, not flat.
  const projected = [];
  for (const p of particles) {
    const wobble = Math.sin(t * p.speed + p.phase) * m.jitterAmp * p.jitter;
    const chaosWobble = m.chaos ? Math.sin(t * p.speed * 4.3 + p.phase * 3) * m.chaos * p.jitter : 0;
    const radius = R * (0.62 + wobble + chaosWobble);
    const theta = p.theta + rotation;
    const x3 = Math.sin(p.phi) * Math.cos(theta);
    const y3 = Math.cos(p.phi);
    const z3 = Math.sin(p.phi) * Math.sin(theta);
    projected.push({
      x: cx + x3 * radius,
      y: cy + y3 * radius * 0.94,
      z: z3,
      size: p.size * dpr * m.sizeMul,
    });
  }
  projected.sort((a, b2) => a.z - b2.z);

  // Constellation lines -- only while actively listening/speaking, between
  // nearby front-facing particles. Drawn before the dots so the dots sit
  // on top of the lines, not under them.
  if (m.connect > 0) {
    const maxDist = R * 0.34;
    ctx.lineWidth = 0.6 * dpr;
    for (let i = 0; i < projected.length; i++) {
      const a = projected[i];
      if (a.z < 0) continue; // front-facing half only -- keeps it legible, not a tangle
      for (let j = i + 1; j < projected.length; j++) {
        const b2 = projected[j];
        if (b2.z < 0) continue;
        const dx = a.x - b2.x, dy = a.y - b2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist >= maxDist) continue;
        const depth = ((a.z + b2.z) / 2 + 1) / 2; // 0..1, average of both points' front/back-ness
        const alpha = m.connect * (1 - dist / maxDist) * (0.3 + 0.7 * depth);
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.stroke();
      }
    }
  }

  for (const pt of projected) {
    const depth = (pt.z + 1) / 2; // 0 = far side, 1 = near side
    const alpha = m.alpha * (0.2 + 0.8 * depth);
    const size = Math.max(0.4, pt.size * (0.45 + 0.75 * depth));
    ctx.beginPath();
    ctx.fillStyle = `rgba(${Math.min(255, r + depth * 70)},${Math.min(255, g + depth * 70)},${Math.min(255, b + depth * 50)},${alpha})`;
    ctx.shadowColor = `rgba(${r},${g},${b},${0.7 * depth})`;
    ctx.shadowBlur = 6 * dpr * depth;
    ctx.arc(pt.x, pt.y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function setState(newState, text) {
  if (newState !== currentState) {
    currentState = newState;
    stateSince = performance.now();
    body.setAttribute("data-state", newState);
    statusEl.textContent = STATE_LABEL[newState] || newState;
  }
  if (text) {
    transcriptEl.textContent = text;
    transcriptWrap.scrollTop = 0; // new message -- start scrolled to the top, not wherever the last drag left it
    transcriptWrap.classList.add("visible");
  } else if (newState === "idle") {
    transcriptWrap.classList.remove("visible");
  }
}

function connect() {
  const es = new EventSource("/events");
  es.onmessage = (ev) => {
    try {
      const data = JSON.parse(ev.data);
      setState(data.state, data.text);
    } catch (e) { /* ignore malformed/keepalive lines */ }
  };
  es.onerror = () => {
    // Browser auto-retries EventSource on its own; nothing to do here.
  };
}
connect();

function tickClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("pt-BR", { hour12: false });
}
tickClock();
setInterval(tickClock, 1000);
</script>
</body>
</html>
