[project]
name = "jarvis"
version = "0.1.0"
description = "Personal voice assistant: wake word + conversation to review/update Nicholas's resume."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
    "docstring-parser>=0.16",
    "openwakeword>=0.6.0",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "rumps>=0.4.0",
    "pvporcupine>=3.0.0",
    "pvrecorder>=1.2.0",
    "faster-whisper>=1.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.45.0",
    "pyobjc-framework-WebKit>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Voice cloning (jarvis/voice/xtts_engine.py) -- kept optional, not a base
# dependency: heavy (~4GB combined), and genuinely fragile to install as of
# 2026-08 -- coqui-tts's own declared "transformers>=4.57" resolves to a 5.x
# release that breaks it (a removed transformers.pytorch_utils helper),
# torch/torchaudio/torchcodec aren't declared as its dependencies at all
# (must be installed separately, matching different ML libs' usual practice
# of not forcing a torch build that might not match the target hardware).
# Pins below are exactly what was verified working together on this
# machine (Apple Silicon, Python 3.12) -- not guessed.
voice-cloning = [
    "coqui-tts[codec]>=0.27.5",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "transformers>=4.57,<5",
]
# Only for scripts/build_app.py, never imported at runtime. py2app's "alias
# mode" (-A) is the actual fix for a real bug: Homebrew's python@3.12 is a
# macOS "framework" build, and CPython's own C startup code silently
# re-execs itself into .../Resources/Python.app/Contents/MacOS/Python
# whenever it isn't already running as that exact binary (confirmed via
# `strings` on the interpreter itself -- this is unconditional, compiled
# in, not something an env var can disable). That swap changes the running
# process's bundle identity from com.nicholasbirochi.jarvis to the generic
# org.python.python, which is exactly what was breaking NSStatusItem (the
# menu bar icon never appeared -- confirmed live via Console.app: "AppKit:
# StatusBar] scene activation failed" on every real double-click launch).
# Alias mode builds a real .app whose own compiled stub owns that identity
# from the start, while still running straight from this project's live
# source/venv -- no freezing, no bundling of dependencies, matching the
# same "don't freeze the fragile heavy dependency tree" reasoning that
# ruled out a full py2app/PyInstaller build elsewhere in this project.
packaging = ["py2app>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jarvis*"]
